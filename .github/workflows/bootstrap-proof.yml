name: bootstrap proof

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: false
      - name: Generate the exact released onboarding files
        shell: bash
        run: |
          set -euo pipefail
          uv tool run --from attest-cli==0.1.0 attest init \
            --repository . \
            --github-repository Parth2412/attest-action-proof \
            --default-branch main \
            --checkout-ref actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 \
            --action-ref Parth2412/attest/action@a1c59cc67bf67aba22ffca876309f855ea8663af \
            --json
          test "$(git status --porcelain=v1 --untracked-files=all)" = "$(printf '%s\n' \
            '?? .attest/config.yaml' \
            '?? .attest/policy.yaml' \
            '?? .github/workflows/attest.yml')"
          sha256sum \
            .attest/config.yaml \
            .attest/policy.yaml \
            .github/workflows/attest.yml
      - name: Create the bot-authored proof commit bundle
        shell: bash
        run: |
          set -euo pipefail
          branch=proof/generated-onboarding
          git switch -c "${branch}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .attest/config.yaml \
            .attest/policy.yaml \
            .github/workflows/attest.yml
          test "$(git diff --cached --name-only)" = "$(printf '%s\n' \
            '.attest/config.yaml' \
            '.attest/policy.yaml' \
            '.github/workflows/attest.yml')"
          git commit -m 'test: add generated attest onboarding'
          git bundle create generated-onboarding.bundle main "${branch}"
          git bundle verify generated-onboarding.bundle
          sha256sum generated-onboarding.bundle
      - name: Retain the exact bot-authored commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-onboarding-bundle-${{ github.run_id }}
          path: generated-onboarding.bundle
          if-no-files-found: error
          retention-days: 90
