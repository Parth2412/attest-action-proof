name: bootstrap proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: false
      - name: Generate the exact released onboarding files
        shell: bash
        run: |
          set -euo pipefail
          uv tool run --from attest-cli==0.1.2 attest init \
            --repository . \
            --github-repository Parth2412/attest-action-proof \
            --default-branch main \
            --checkout-ref actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 \
            --action-ref Parth2412/attest/action@60951624b5572aa1f54db9c2693cb7a8e0399425 \
            --json
          test "$(git status --porcelain=v1 --untracked-files=all)" = "$(printf '%s\n' \
            '?? .attest/config.yaml' \
            '?? .attest/policy.yaml' \
            '?? .github/workflows/attest.yml')"
          sha256sum \
            .attest/config.yaml \
            .attest/policy.yaml \
            .github/workflows/attest.yml
          grep -Fqx \
            '      - uses: Parth2412/attest/action@60951624b5572aa1f54db9c2693cb7a8e0399425' \
            .github/workflows/attest.yml
          grep -Fqx \
            '  identity: "https://github.com/Parth2412/attest-action-proof/.github/workflows/attest.yml@refs/pull/*/merge"' \
            .attest/config.yaml
          grep -Fqx \
            '        identity: "https://github.com/Parth2412/attest-action-proof/.github/workflows/attest.yml@refs/pull/*/merge"' \
            .attest/policy.yaml
          token_line='          GITHUB_TOKEN: $'
          token_line+='{{ github.token }}'
          grep -Fqx "${token_line}" .github/workflows/attest.yml
      - name: Create the bot-authored proof commit bundle
        shell: bash
        run: |
          set -euo pipefail
          branch=proof/generated-onboarding-v0.1.2
          git switch -c "${branch}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .attest/config.yaml \
            .attest/policy.yaml
          test "$(git diff --cached --name-only)" = "$(printf '%s\n' \
            '.attest/config.yaml' \
            '.attest/policy.yaml')"
          git commit -m 'test(proof): seed generated attest policy'
          git rev-parse HEAD > proof-seed-commit.txt
          printf '%s\n' \
            '"""Proof fixture: importing repository content must fail the run."""' \
            'raise RuntimeError("repository-controlled sitecustomize.py executed")' \
            > sitecustomize.py
          git add -- sitecustomize.py
          test "$(git diff --cached --name-only)" = 'sitecustomize.py'
          git commit -m 'test(proof): add nonexecution fixture'
          git rev-parse HEAD > proof-precheck-commit.txt
          git add -- .github/workflows/attest.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/attest.yml'
          git commit -m 'test(proof): activate released attest workflow'
          git rev-parse HEAD > proof-final-commit.txt
          git bundle create generated-onboarding-v0.1.2.bundle main "${branch}"
          git bundle verify generated-onboarding-v0.1.2.bundle
          sha256sum generated-onboarding-v0.1.2.bundle
      - name: Retain the exact bot-authored commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-onboarding-v0.1.2-bundle-${{ github.run_id }}
          path: |
            generated-onboarding-v0.1.2.bundle
            proof-seed-commit.txt
            proof-precheck-commit.txt
            proof-final-commit.txt
          if-no-files-found: error
          retention-days: 90
