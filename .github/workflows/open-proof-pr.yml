name: open proof pull request

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open the bot-authored proof pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-open-evidence
          pr_url="$(gh pr create \
            --repo Parth2412/attest-action-proof \
            --base main \
            --head proof/generated-onboarding-v0.1.2 \
            --title 'Prove released attest onboarding' \
            --body 'Adds the exact files generated by public attest-cli 0.1.2, a repository-content nonexecution trap, and the full commit behind immutable Action v1.0.2.')"
          printf '%s\n' "${pr_url}" > proof-open-evidence/pull-request-url.txt
          pr_number="$(gh pr view "${pr_url}" --json number --jq .number)"
          head_sha="$(gh api "repos/Parth2412/attest-action-proof/pulls/${pr_number}" --jq .head.sha)"
          gh api repos/Parth2412/attest-action-proof/branches/main/protection \
            > proof-open-evidence/branch-protection.json
          gh api "repos/Parth2412/attest-action-proof/pulls/${pr_number}" \
            > proof-open-evidence/pull-request-initial.json
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/Parth2412/attest-action-proof/commits/${head_sha}/check-runs" \
            > proof-open-evidence/check-runs-initial.json
          test "$(jq '[.check_runs[] | select(.name == "attest")] | length' \
            proof-open-evidence/check-runs-initial.json)" = 0
          for attempt in $(seq 1 10); do
            gh pr view "${pr_url}" \
              --json number,headRefOid,mergeable,mergeStateStatus,reviewDecision,url \
              > proof-open-evidence/protected-state-initial.json
            state="$(jq -r .mergeStateStatus \
              proof-open-evidence/protected-state-initial.json)"
            if test "${state}" != UNKNOWN; then
              break
            fi
            sleep 1
          done
          test "${state}" = BLOCKED
          test "$(jq -r .required_status_checks.contexts[] \
            proof-open-evidence/branch-protection.json)" = attest
      - name: Retain the blocked-before-check evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocked-before-check-evidence-${{ github.run_id }}
          path: proof-open-evidence
          if-no-files-found: error
          retention-days: 90
