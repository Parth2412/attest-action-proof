name: open proof pull request

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open the bot-authored proof pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --repo Parth2412/attest-action-proof \
            --base main \
            --head proof/generated-onboarding-v0.1.1 \
            --title 'Prove corrected attest onboarding' \
            --body 'Adds only the three exact files generated by public attest-cli 0.1.1 and pins the corrected immutable Action v1.0.1 commit.'
